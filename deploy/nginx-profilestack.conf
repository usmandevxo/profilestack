server {
    listen 80;
    server_name profilestack.rerouter.online;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name profilestack.rerouter.online;
    ssl_certificate /www/server/panel/vhost/cert/profilestack.rerouter.online/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/profilestack.rerouter.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # All static requests pass through application access control.
    # Do not alias this directory: it may contain private reports.
    location /static/ {
        proxy_pass http://127.0.0.1:7800;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
        access_log off;
    }

    location = /_profile_auth {
        internal;
        proxy_pass http://127.0.0.1:7800/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Session-Token "";
        proxy_set_header Host $host;
    }

    # Protect browser screens and WebSocket handshakes with a web session.
    location ~ ^/vnc-stream/(?<vnc_port>62(?:0[1-9]|[1-9][0-9]))/(?<vnc_path>.*)$ {
        auth_request /_profile_auth;
        proxy_pass http://127.0.0.1:$vnc_port/$vnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        access_log off;
    }
    location /vnc-stream/ { return 404; }

    # Both SSE GETs and message POSTs require the application API-key guard.
    location ~ ^/mcp(?:/|$) {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    client_max_body_size 500m;
    access_log /www/wwwlogs/profilestack.rerouter.online.log;
    error_log /www/wwwlogs/profilestack.rerouter.online.error.log;
}
